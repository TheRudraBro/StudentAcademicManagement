<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - CourseBook</title>

    <link rel="stylesheet" href="Theme/style.css" />

    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #e9ecef;
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .auth-container {
        background-color: #262261;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 400px;
        overflow: hidden;
      }
      
      .brand-header {
        background: white;
        padding: 20px 10px;
        text-align: center;
        width: 100%;
        box-sizing: border-box;
      }
      .slogan {
        font-size: 15px;
        font-weight: 900;
        color: #000;
        text-transform: uppercase;
        margin-bottom: 10px;
        letter-spacing: 0.5px;
      }
      .logo-title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 15px;
      }
      .brand-logo {
        width: 75px; 
        height: auto;
      }
      .brand-title {
        display: flex;
        flex-direction: column;
        text-align: left;
        line-height: 0.9;
      }
      .text-course {
        font-size: 38px;
        font-weight: 900;
        color: #0056b3;
        text-transform: uppercase;
      }
      .text-book {
        font-size: 38px;
        font-weight: 900;
        color: #0056b3;
        text-transform: uppercase;
      }

      .auth-body {
        padding: 30px;
      }
      .input-group {
        margin-bottom: 15px;
      }
      .input-group input,
      .input-group select {
        width: 100%;
        padding: 12px 15px;
        border: none;
        border-radius: 2px;
        outline: none;
        box-sizing: border-box;
        font-size: 15px;
        background-color: #ffffff;
      }
      .input-group input::placeholder {
        color: #888;
      }
      
      .action-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
      }
      .forgot-password {
        color: #ffeb3b;
        font-size: 13px;
        font-weight: bold;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      .lock-icon {
        background: #00bcd4;
        color: white;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        font-size: 10px;
      }
      .auth-btn {
        padding: 10px 35px;
        background-color: #ffffff;
        color: #000000;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        font-size: 15px;
        font-weight: bold;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      }
      .auth-btn:hover {
        background-color: #f1f1f1;
      }
      
      .toggle-text {
        margin-top: 25px;
        font-size: 13px;
        color: #cfd8dc;
        text-align: center;
      }
      .toggle-text span {
        color: #4fc3f7;
        cursor: pointer;
        font-weight: bold;
      }
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
        
      <div class="brand-header">
        <div class="slogan">A NEW NEXUS OF EXCELLENCE</div>
        <div class="logo-title-row">
          <img src="Assets/CBLogo.png" alt="Logo" class="brand-logo" />
          <div class="brand-title">
            <span class="text-course">Course</span>
            <span class="text-book">Book</span>
          </div>
        </div>
      </div>

      <div class="auth-body">
        
        <!-- LOGIN FORM -->
        <div id="login-section">
          <form id="login-form">
            <div class="input-group">
              <input type="email" id="login-email" placeholder="Enter your ID / Email" required />
            </div>
            <div class="input-group">
              <input type="password" id="login-password" placeholder="Enter your password" required />
            </div>
            
            <div class="action-row">
              <div class="forgot-password" id="forgot-password-btn">
                <span class="lock-icon">🔒</span>
                FORGOT<br>PASSWORD
              </div>
              <button type="submit" class="auth-btn">Login</button>
            </div>
          </form>
          <p class="toggle-text">
            Don't have an account? <span onclick="toggleForm()">Sign Up here</span>
          </p>
        </div>

        <!-- SIGNUP FORM -->
        <div id="signup-section" class="hidden">
          <form id="signup-form">
            <div class="input-group">
              <input type="text" id="signup-name" placeholder="Enter your full name" required />
            </div>
            <div class="input-group">
              <select id="signup-role" required>
                <option value="student" selected>Student</option>
                <option value="teacher">Teacher</option>
                <option value="admin">Admin</option>
              </select>
            </div>
            <div class="input-group">
              <input type="email" id="signup-email" placeholder="Enter your email" required />
            </div>
            <div class="input-group">
              <input type="password" id="signup-password" placeholder="Create password (min 6 chars)" required />
            </div>
            
            <div class="action-row" style="justify-content: flex-end;">
              <button type="submit" class="auth-btn" style="background-color: #0056b3; color: white;">Sign Up</button>
            </div>
          </form>
          <p class="toggle-text">
            Already have an account? <span onclick="toggleForm()">Login here</span>
          </p>
        </div>

      </div>
    </div>

    <script>
      function toggleForm() {
        const loginSection = document.getElementById("login-section");
        const signupSection = document.getElementById("signup-section");
        if (loginSection.classList.contains("hidden")) {
          loginSection.classList.remove("hidden");
          signupSection.classList.add("hidden");
        } else {
          loginSection.classList.add("hidden");
          signupSection.classList.remove("hidden");
        }
      }
    </script>

    <!-- FIREBASE SCRIPT -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
      // Database import
      import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC1VrcMa2Zo3wlhpEhDa14IrbXlEtjobjQ",
        authDomain: "studentmanagement-84401.firebaseapp.com",
        projectId: "studentmanagement-84401",
        storageBucket: "studentmanagement-84401.firebasestorage.app",
        messagingSenderId: "1023520287147",
        appId: "1:1023520287147:web:a20a35d9f98cac6afa4aee",
        measurementId: "G-YKRXVYKL72",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      onAuthStateChanged(auth, (user) => {
        if (user && user.emailVerified) {
            window.location.replace("dashboard.html");
        }
      });

      // Forgot Password Logic
      document.getElementById("forgot-password-btn").addEventListener("click", () => {
        const email = document.getElementById("login-email").value;
        if (!email) {
          alert("Prothome 'Enter your ID / Email' box-e apnar email type korun, tarpor 'Forgot Password'-e click korun.");
          return;
        }
        sendPasswordResetEmail(auth, email)
          .then(() => alert("Password reset link apnar email-e pathano hoyeche! Inbox check korun."))
          .catch((error) => alert("Error: " + error.message));
      });

      // Signup Logic with Firestore Database Save
      document.getElementById("signup-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;
        const name = document.getElementById("signup-name").value;
        const role = document.getElementById("signup-role").value;
        
        try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            
            // User er details database e save kora
            await setDoc(doc(db, "users", userCredential.user.uid), {
                name: name,
                email: email,
                role: role,
                createdAt: new Date()
            });

            await sendEmailVerification(userCredential.user);
            alert("Account Created Successfully! A verification email has been sent.");
            toggleForm();
            document.getElementById("signup-form").reset();
        } catch(error) {
            alert("Error: " + error.message);
        }
      });

      // Login Logic
      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            if (!userCredential.user.emailVerified) {
                alert("Please verify your email address first.");
                return;
            }
            window.location.replace("dashboard.html");
          })
          .catch((error) => {
            alert("Login Failed: " + error.message);
          });
      });
    </script>
  </body>
</html>
