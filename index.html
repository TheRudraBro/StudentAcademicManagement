<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Academic Management - Coursebook</title>
  
  <style>
    /* ==================== RESET & BASE ==================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      scroll-behavior: smooth;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #f8f9fa;
      color: #2c3e50;
      line-height: 1.6;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.dark-mode {
      background: #1a1f2e;
      color: #ecf0f1;
    }

    /* ==================== TYPOGRAPHY ==================== */
    h1, h2, h3, h4, h5, h6 {
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 0.5em;
    }

    h1 { font-size: 2rem; }
    h2 { font-size: 1.5rem; }
    h3 { font-size: 1.25rem; }
    h4 { font-size: 1.1rem; }
    h5 { font-size: 1rem; }
    h6 { font-size: 0.9rem; }

    p {
      margin-bottom: 1rem;
    }

    a {
      color: #3498db;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    a:hover {
      color: #2980b9;
    }

    /* ==================== SVG ICONS ==================== */
    .icon {
      width: 1.25em;
      height: 1.25em;
      display: inline-block;
      vertical-align: -0.125em;
    }

    /* ==================== BUTTONS ==================== */
    button {
      cursor: pointer;
      border: none;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 8px;
      background: transparent;
      color: #555;
      cursor: pointer;
    }

    body.dark-mode .icon-btn {
      color: #aaa;
    }

    .icon-btn:hover {
      background: rgba(52, 152, 219, 0.1);
      color: #3498db;
    }

    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #3498db, #2980b9);
      color: white;
      box-shadow: 0 2px 8px rgba(52, 152, 219, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
    }

    .btn-secondary {
      background: #ecf0f1;
      color: #2c3e50;
    }

    body.dark-mode .btn-secondary {
      background: #2c3e50;
      color: #ecf0f1;
    }

    .btn-secondary:hover {
      background: #d5dbdb;
    }

    body.dark-mode .btn-secondary:hover {
      background: #34495e;
    }

    .link-btn {
      background: none;
      color: #3498db;
      padding: 0.25rem 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .link-btn:hover {
      color: #2980b9;
      text-decoration: underline;
    }

    /* ==================== LOADER ==================== */
    #appLoader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #appLoader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loader-mark {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    /* ==================== LAYOUT ==================== */
    .app-shell {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .sidebar-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 998;
    }

    .sidebar-backdrop.active {
      display: block;
    }

    .sidebar {
      grid-column: 1;
      grid-row: 1;
      background: white;
      border-right: 1px solid #e0e6ed;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      transition: transform 0.3s ease;
      position: relative;
      z-index: 999;
    }

    body.dark-mode .sidebar {
      background: #252d3d;
      border-right-color: #3a4455;
    }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid #e0e6ed;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    body.dark-mode .sidebar-header {
      border-bottom-color: #3a4455;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .brand-mark {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 8px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
    }

    .brand-name {
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .sidebar-close {
      display: none;
    }

    .sidebar-nav {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 0.5rem;
      overflow-y: auto;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: transparent;
      color: #555;
      font-weight: 500;
      text-align: left;
      transition: all 0.2s ease;
    }

    body.dark-mode .nav-item {
      color: #aaa;
    }

    .nav-item:hover {
      background: rgba(52, 152, 219, 0.08);
      color: #3498db;
    }

    .nav-item.active {
      background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
      color: #667eea;
      font-weight: 600;
    }

    .nav-item span {
      flex: 1;
    }

    .sidebar-footer {
      border-top: 1px solid #e0e6ed;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    body.dark-mode .sidebar-footer {
      border-top-color: #3a4455;
    }

    .main-area {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* ==================== TOPBAR ==================== */
    .topbar {
      background: white;
      border-bottom: 1px solid #e0e6ed;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
      transition: background-color 0.3s ease;
    }

    body.dark-mode .topbar {
      background: #252d3d;
      border-bottom-color: #3a4455;
    }

    .menu-btn {
      display: none;
    }

    .page-title {
      flex: 1;
      font-size: 1.5rem;
      font-weight: 600;
    }

    .topbar-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    /* ==================== CONTENT AREA ==================== */
    .content {
      flex: 1;
      padding: 2rem;
      overflow-y: auto;
    }

    .page {
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== DASHBOARD ==================== */
    .dashboard-greeting {
      margin-bottom: 2rem;
    }

    .dashboard-greeting h2 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .date-line {
      display: inline-block;
      color: #7f8c8d;
      font-size: 0.95rem;
    }

    body.dark-mode .date-line {
      color: #95a5a6;
    }

    .stat-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
      border-left: 4px solid #3498db;
    }

    body.dark-mode .stat-card {
      background: #2c3e50;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .stat-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    body.dark-mode .stat-card:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .stat-label {
      color: #7f8c8d;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
    }

    body.dark-mode .stat-label {
      color: #95a5a6;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: #2c3e50;
    }

    body.dark-mode .stat-value {
      color: #ecf0f1;
    }

    /* ==================== DASHBOARD GRID ==================== */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 2rem;
    }

    .dash-panel {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
      transition: all 0.3s ease;
    }

    body.dark-mode .dash-panel {
      background: #2c3e50;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .dash-panel:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
    }

    body.dark-mode .dash-panel:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    .dash-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e0e6ed;
    }

    body.dark-mode .dash-panel-header {
      border-bottom-color: #3a4455;
    }

    .dash-panel-header h3 {
      margin: 0;
      font-size: 1.15rem;
    }

    /* ==================== LISTS ==================== */
    .item-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .item {
      padding: 0.75rem;
      border-radius: 8px;
      background: #f8f9fa;
      border-left: 3px solid #3498db;
      transition: all 0.2s ease;
    }

    body.dark-mode .item {
      background: #1a1f2e;
      border-left-color: #667eea;
    }

    .item:hover {
      background: #eaf2f8;
      transform: translateX(4px);
    }

    body.dark-mode .item:hover {
      background: #222938;
    }

    .item-title {
      font-weight: 600;
      margin-bottom: 0.25rem;
      color: #2c3e50;
    }

    body.dark-mode .item-title {
      color: #ecf0f1;
    }

    .item-meta {
      font-size: 0.85rem;
      color: #7f8c8d;
    }

    body.dark-mode .item-meta {
      color: #95a5a6;
    }

    .empty-state {
      text-align: center;
      padding: 2rem 1rem;
      color: #95a5a6;
    }

    .empty-state svg {
      width: 3rem;
      height: 3rem;
      opacity: 0.5;
      margin-bottom: 1rem;
    }

    /* ==================== TOOLBAR ==================== */
    .page-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .page-toolbar-info {
      flex: 1;
    }

    .page-toolbar-info h2 {
      margin: 0;
    }

    .filter-bar {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    /* ==================== ROUTINE GRID ==================== */
    .routine-grid-wrap {
      display: block;
    }

    .routine-mobile {
      display: none;
    }

    .routine-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.5rem;
      background: white;
      padding: 1.5rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    body.dark-mode .routine-grid {
      background: #2c3e50;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .day-header {
      text-align: center;
      font-weight: 600;
      padding: 1rem;
      color: #667eea;
      border-bottom: 2px solid #667eea;
      margin-bottom: 0.5rem;
    }

    .class-slot {
      padding: 1rem;
      border-radius: 8px;
      background: #f0f4ff;
      border-left: 4px solid #667eea;
      font-size: 0.85rem;
      text-align: center;
      transition: all 0.2s ease;
    }

    body.dark-mode .class-slot {
      background: #1a243d;
    }

    .class-slot:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
    }

    /* ==================== DAY TABS ==================== */
    .day-tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
    }

    .day-tab {
      padding: 0.5rem 1rem;
      border-radius: 8px;
      background: #f0f0f0;
      color: #555;
      white-space: nowrap;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    body.dark-mode .day-tab {
      background: #2c3e50;
      color: #aaa;
    }

    .day-tab.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
    }

    /* ==================== FORMS ==================== */
    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: #2c3e50;
    }

    body.dark-mode label {
      color: #ecf0f1;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #d0d8e0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      transition: all 0.2s ease;
    }

    body.dark-mode input,
    body.dark-mode textarea,
    body.dark-mode select {
      background: #2c3e50;
      border-color: #3a4455;
      color: #ecf0f1;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    /* ==================== MODAL ==================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.3s ease;
    }

    body.dark-mode .modal {
      background: #252d3d;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #e0e6ed;
    }

    body.dark-mode .modal-header {
      border-bottom-color: #3a4455;
    }

    .modal-header h2 {
      margin: 0;
    }

    .modal-close {
      background: none;
      padding: 0.25rem;
    }

    .modal-footer {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #e0e6ed;
    }

    body.dark-mode .modal-footer {
      border-top-color: #3a4455;
    }

    /* ==================== TOAST ==================== */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: white;
      padding: 1.25rem;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 400px;
      animation: slideInRight 0.3s ease;
      z-index: 2000;
    }

    body.dark-mode .toast {
      background: #2c3e50;
    }

    @keyframes slideInRight {
      from {
        opacity: 0;
        transform: translateX(400px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .toast.success {
      border-left: 4px solid #27ae60;
    }

    .toast.error {
      border-left: 4px solid #e74c3c;
    }

    .toast.info {
      border-left: 4px solid #3498db;
    }

    /* ==================== RESPONSIVE ==================== */
    @media (max-width: 768px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        height: 100vh;
        width: 280px;
        transform: translateX(-100%);
        z-index: 999;
      }

      .sidebar.active {
        transform: translateX(0);
      }

      .sidebar-close {
        display: flex;
      }

      .menu-btn {
        display: flex;
      }

      .main-area {
        grid-column: 1;
      }

      .content {
        padding: 1.5rem;
      }

      .page-title {
        font-size: 1.25rem;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .stat-strip {
        grid-template-columns: 1fr;
      }

      .routine-grid-wrap {
        display: none;
      }

      .routine-mobile {
        display: block;
      }

      .topbar {
        padding: 1rem;
      }

      .toast {
        right: 1rem;
        left: 1rem;
        width: auto;
      }
    }

    @media (max-width: 480px) {
      body {
        font-size: 14px;
      }

      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.25rem; }
      h3 { font-size: 1rem; }

      .btn {
        padding: 0.6rem 1rem;
        font-size: 0.85rem;
      }

      .dashboard-greeting h2 {
        font-size: 1.5rem;
      }

      .modal {
        width: 95%;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div id="appLoader">
    <div class="loader-mark">C</div>
    <p>Opening your coursebook…</p>
  </div>

  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-mark">C</div>
          <span class="brand-name">Coursebook</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarCloseBtn" aria-label="Close menu">__ICON_x__</button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <button class="nav-item active" data-section="dashboard">__ICON_home__<span>Dashboard</span></button>
        <button class="nav-item" data-section="routine">__ICON_calendar__<span>Class routine</span></button>
        <button class="nav-item" data-section="assignments">__ICON_clipboard__<span>Assignments</span></button>
        <button class="nav-item" data-section="exams">__ICON_examfile__<span>Exam schedule</span></button>
        <button class="nav-item" data-section="attendance">__ICON_checkcircle__<span>Attendance</span></button>
        <button class="nav-item" data-section="cgpa">__ICON_barchart__<span>CGPA calculator</span></button>
        <button class="nav-item" data-section="materials">__ICON_book__<span>Course materials</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" id="settingsBtn">__ICON_sliders__<span>Settings</span></button>
        <button class="nav-item" id="themeToggleBtn">__ICON_moon__<span id="themeToggleLabel">Dark mode</span></button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu">__ICON_menu__</button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
        <div class="topbar-actions">
          <button class="icon-btn" id="themeToggleTop" aria-label="Toggle theme">__ICON_moon__</button>
        </div>
      </header>

      <main class="content">

        <!-- ================= DASHBOARD ================= -->
        <section class="page active" id="section-dashboard">
          <div class="dashboard-greeting">
            <h2 id="greetingText">Welcome back</h2>
            <span class="date-line" id="greetingDate"></span>
          </div>

          <div class="stat-strip" id="statStrip"></div>

          <div class="dashboard-grid">
            <div class="dash-panel">
              <div class="dash-panel-header">
                <h3>Today's classes</h3>
              </div>
              <div id="todayClassesList"></div>
            </div>
            <div class="dash-panel">
              <div class="dash-panel-header">
                <h3>Upcoming deadlines</h3>
                <button class="link-btn" data-goto="assignments">View all</button>
              </div>
              <div id="upcomingAssignmentsList"></div>
            </div>
            <div class="dash-panel">
              <div class="dash-panel-header">
                <h3>Upcoming exams</h3>
                <button class="link-btn" data-goto="exams">View all</button>
              </div>
              <div id="upcomingExamsList"></div>
            </div>
            <div class="dash-panel">
              <div class="dash-panel-header">
                <h3>Attendance watch</h3>
                <button class="link-btn" data-goto="attendance">View all</button>
              </div>
              <div id="attendanceWatchList"></div>
            </div>
          </div>
        </section>

        <!-- ================= ROUTINE ================= -->
        <section class="page" id="section-routine">
          <div class="page-toolbar">
            <div class="page-toolbar-info"><h2>Class routine</h2></div>
            <button class="btn btn-primary" id="addRoutineBtn">__ICON_plus__<span>Add class</span></button>
          </div>
          <div class="routine-grid-wrap">
            <div class="routine-grid" id="routineGrid"></div>
          </div>
          <div class="routine-mobile" id="routineMobile">
            <div class="day-tabs" id="dayTabs"></div>
            <div id="routineDayList"></div>
          </div>
        </section>

        <!-- ================= ASSIGNMENTS ================= -->
        <section class="page" id="section-assignments">
          <div class="page-toolbar">
            <div class="filter-bar">
              <select class="select" id="assignmentStatusFilter">
                <option value="all">All statuses</option>
                <option value="pending">Pending</option>
                <option value="in-progress">In progress</option>
                <option value="completed">Completed</option>
              </select>
              <select class="select" id="assignmentSubjectFilter"><option value="all">All subjects</option></select>
            </div>
            <button class="btn btn-primary" id="addAssignmentBtn">__ICON_plus__<span>Add assignment</span></button>
          </div>
          <div id="assignmentsContainer"></div>
        </section>

        <!-- ================= EXAMS ================= -->
        <section class="page" id="section-exams">
          <div class="page-toolbar">
            <div class="page-toolbar-info"><h2>Exam schedule</h2></div>
            <button class="btn btn-primary" id="addExamBtn">__ICON_plus__<span>Add exam</span></button>
          </div>
          <div id="nextExamBanner"></div>
          <div id="examsContainer"></div>
        </section>

        <!-- ================= ATTENDANCE ================= -->
        <section class="page" id="section-attendance">
          <div class="page-toolbar">
            <div class="page-toolbar-info"><h2>Attendance</h2></div>
            <div class="toolbar-btns">
              <button class="btn btn-secondary" id="addAttendanceSubjectBtn">__ICON_plus__<span>Add subject</span></button>
            </div>
          </div>
          <div class="dash-panel hidden" id="quickMarkPanel" style="margin-bottom: var(--space-5);">
            <div class="dash-panel-header"><h3>Quick mark — today's classes</h3></div>
            <div id="quickMarkList"></div>
          </div>
          <div class="subject-grid" id="attendanceSubjectsGrid"></div>
        </section>

        <!-- ================= CGPA ================= -->
        <section class="page" id="section-cgpa">
          <div class="page-toolbar">
            <div class="page-toolbar-info"><h2>Result / CGPA calculator</h2></div>
            <div class="toolbar-btns">
              <button class="btn btn-secondary" id="gradeScaleBtn">__ICON_sliders__<span>Grade scale</span></button>
              <button class="btn btn-primary" id="addSemesterBtn">__ICON_plus__<span>Add semester</span></button>
            </div>
          </div>
          <div class="cgpa-summary" id="cgpaSummary"></div>
          <div class="cgpa-chart-wrap hidden" id="cgpaChartWrap">
            <h3>SGPA by semester</h3>
            <div id="cgpaChart"></div>
          </div>
          <div id="semestersContainer"></div>
        </section>

        <!-- ================= MATERIALS ================= -->
        <section class="page" id="section-materials">
          <div class="page-toolbar">
            <div class="filter-bar">
              <input class="input" type="search" id="materialsSearch" placeholder="Search materials…">
              <select class="select" id="materialsSubjectFilter"><option value="all">All subjects</option></select>
            </div>
            <button class="btn btn-primary" id="addMaterialBtn">__ICON_plus__<span>Add material</span></button>
          </div>
          <div class="materials-grid" id="materialsContainer"></div>
        </section>

      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Title</h2>
        <button class="icon-btn" id="modalCloseBtn" aria-label="Close">__ICON_x__</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <datalist id="subjectsDatalist"></datalist>

  <script src="script.js"></script>
</body>
</html>
