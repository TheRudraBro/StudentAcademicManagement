<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Student Academic Management</title>

    <!-- Apnar existing CSS file link kora holo -->
    <link rel="stylesheet" href="Theme/style.css" />

    <style>
      /* Form er jonno kichu premium custom CSS */
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f7f6;
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .auth-container {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }
      .auth-logo {
        width: 80px;
        margin-bottom: 20px;
      }
      .auth-container h2 {
        margin-bottom: 20px;
        color: #333;
      }
      .input-group {
        margin-bottom: 15px;
        text-align: left;
      }
      .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #666;
        font-size: 14px;
      }
      .input-group input,
      .input-group select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
        box-sizing: border-box;
      }
      .input-group input:focus,
      .input-group select:focus {
        border-color: #007bff;
      }
      .auth-btn {
        width: 100%;
        padding: 12px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        transition: background 0.3s;
      }
      .auth-btn:hover {
        background-color: #0056b3;
      }
      .toggle-text {
        margin-top: 15px;
        font-size: 14px;
        color: #555;
      }
      .toggle-text span {
        color: #007bff;
        cursor: pointer;
        font-weight: bold;
      }
      /* Hidden class to toggle forms */
      .hidden {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="auth-container">
      <!-- Logo from your Assets folder -->
      <img src="Assets/CBLogo.png" alt="Logo" class="auth-logo" />

      <!-- LOGIN FORM -->
      <div id="login-section">
        <h2>Welcome Back</h2>
        <form id="login-form">
          <div class="input-group">
            <label for="login-email">Email</label>
            <input
              type="email"
              id="login-email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="input-group">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              placeholder="Enter your password"
              required
            />
          </div>
          <button type="submit" class="auth-btn">Login</button>
        </form>
        <p class="toggle-text">
          Don't have an account?
          <span onclick="toggleForm()">Sign Up here</span>
        </p>
      </div>

      <!-- SIGNUP FORM (Initially Hidden) -->
      <div id="signup-section" class="hidden">
        <h2>Create Account</h2>
        <form id="signup-form">
          <div class="input-group">
            <label for="signup-name">Full Name</label>
            <input
              type="text"
              id="signup-name"
              placeholder="Enter your name"
              required
            />
          </div>
          <div class="input-group">
            <label for="signup-role">Select Role</label>
            <select id="signup-role" required>
              <option value="student">Student</option>
              <option value="teacher">Teacher</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="input-group">
            <label for="signup-email">Email</label>
            <input
              type="email"
              id="signup-email"
              placeholder="Enter your email"
              required
            />
          </div>
          <div class="input-group">
            <label for="signup-password">Password</label>
            <input
              type="password"
              id="signup-password"
              placeholder="Create a password (min 6 chars)"
              required
            />
          </div>
          <button type="submit" class="auth-btn">Sign Up</button>
        </form>
        <p class="toggle-text">
          Already have an account?
          <span onclick="toggleForm()">Login here</span>
        </p>
      </div>
    </div>

    <!-- UI Toggle Script -->
    <script>
      function toggleForm() {
        const loginSection = document.getElementById("login-section");
        const signupSection = document.getElementById("signup-section");

        if (loginSection.classList.contains("hidden")) {
          loginSection.classList.remove("hidden");
          signupSection.classList.add("hidden");
        } else {
          loginSection.classList.add("hidden");
          signupSection.classList.remove("hidden");
        }
      }
    </script>

 <!-- FIREBASE AUTHENTICATION SCRIPT -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC1VrcMa2Zo3wlhpEhDa14IrbXlEtjobjQ",
        authDomain: "studentmanagement-84401.firebaseapp.com",
        projectId: "studentmanagement-84401",
        storageBucket: "studentmanagement-84401.firebasestorage.app",
        messagingSenderId: "1023520287147",
        appId: "1:1023520287147:web:a20a35d9f98cac6afa4aee",
        measurementId: "G-YKRXVYKL72",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // NO-BACK FIX: User already login kora thakle direct dashboard e pathiye dibe
      onAuthStateChanged(auth, (user) => {
        if (user && user.emailVerified) {
            window.location.replace("dashboard.html");
        }
      });

      // Sign Up Logic
      document.getElementById("signup-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("signup-email").value;
        const password = document.getElementById("signup-password").value;
        const role = document.getElementById("signup-role").value;

        createUserWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            sendEmailVerification(userCredential.user).then(() => {
                alert("Account Created Successfully! A verification email has been sent.");
                toggleForm();
                document.getElementById("signup-form").reset();
            });
          })
          .catch((error) => {
            alert("Error: " + error.message);
          });
      });

      // Login Logic
      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        signInWithEmailAndPassword(auth, email, password)
          .then((userCredential) => {
            if (!userCredential.user.emailVerified) {
                alert("Please verify your email address first.");
                return;
            }
            alert("Login Successful!");
            // NO-BACK FIX: .href er bodole .replace use kora holo
            window.location.replace("dashboard.html");
          })
          .catch((error) => {
            alert("Error: " + error.message);
          });
      });
    </script>
  </body>
</html>
