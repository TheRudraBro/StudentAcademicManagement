<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1C6B5A">
<script type="module" src="Function/script.js" defer></script>
<link rel="stylesheet" href="Theme/style.css">
<link rel="icon" type="image/x-icon" href="Assets/CourseBook.png">
<meta name="description" content="Coursebook — a complete student academic management platform for class routines, assignments, exams, attendance, CGPA, and course materials.">
<title>Coursebook — Student Academic Management Platform</title>

</head>
<body>
  <div id="appLoader">
    <div class="loader-mark">C</div>
    <p>Opening your coursebook…</p>
  </div>

  <div class="app-shell">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="brand">
          <img src="Assets/CBLogo.png" alt="CourseBook Logo" class="brand-mark">
          <span class="brand-name">Course Book</span>
        </div>
        <button class="icon-btn sidebar-close" id="sidebarCloseBtn" aria-label="Close menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <button class="nav-item active" data-section="dashboard"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11L12 4l8 7"/><path d="M6 10v10h5v-6h2v6h5V10"/></svg><span>Dashboard</span></button>
        <button class="nav-item" data-section="routine"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg><span>Class routine</span></button>
        <button class="nav-item" data-section="assignments"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="8" y1="19" x2="13" y2="19"/></svg><span>Assignments</span></button>
        <button class="nav-item" data-section="exams"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"/><polyline points="15 2 15 7 20 7"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg><span>Exam schedule</span></button>
        <button class="nav-item" data-section="attendance"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="8 12 11 15 16 9"/></svg><span>Attendance</span></button>
        <button class="nav-item" data-section="cgpa"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="20" x2="6" y2="12"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="18" y1="20" x2="18" y2="14"/></svg><span>CGPA calculator</span></button>
        <button class="nav-item" data-section="materials"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/></svg><span>Course materials</span></button>
      </nav>
      <div class="sidebar-footer">
        <button class="nav-item" id="settingsBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="18" r="2"/></svg><span>Settings</span></button>
        <button class="nav-item" id="themeToggleBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg><span id="themeToggleLabel">Dark mode</span></button>
      </div>
    </aside>

    <div class="main-area">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        <h1 class="page-title" id="pageTitle">Dashboard</h1>
       <div class="topbar-actions">
          <button class="icon-btn" id="themeToggleTop" aria-label="Toggle theme"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg></button>
          
          <!-- NOTUN: Profile Button Ekhane Add Kora Holo -->
          <button id="profile-btn" style="background-color: #1C6B5A; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-left: 15px; font-size: 14px; box-shadow: 0 2px 4px rgba(28, 107, 90, 0.3);">Profile</button>

          <!-- Ager Logout Button -->
          <button id="logout-btn" style="background-color: #ff4757; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-left: 10px; font-size: 14px; box-shadow: 0 2px 4px rgba(255, 71, 87, 0.3);">Logout</button>
        </div>
      </header>

      <main class="content">

        <!-- ================= DASHBOARD ================= -->
        <section class="page active" id="section-dashboard">
          <div class="dashboard-greeting">
            <h2 id="greetingText">Welcome back</h2>
            <span class="date-line" id="greetingDate"></span>
          </div>

          <div class="stat-strip" id="statStrip"></div>

          <div class="dashboard-grid">
            <div class="dash-panel">
              <div class="dash-panel-header">
                <h3>Today's classes</h3>
              </div>
              <div id="todayClassesList"></div>
            </div>
            <div class="dash-panel">
              <div class="dash-panel-header">
                <h3>Upcoming deadlines</h3>
                <button class="link-btn" data-goto="assignments">View all</button>
              </div>
              <div id="upcomingAssignmentsList"></div>
            </div>
            <div class="dash-panel">
              <div class="dash-panel-header">
                <h3>Upcoming exams</h3>
                <button class="link-btn" data-goto="exams">View all</button>
              </div>
              <div id="upcomingExamsList"></div>
            </div>
            <div class="dash-panel">
              <div class="dash-panel-header">
                <h3>Attendance watch</h3>
                <button class="link-btn" data-goto="attendance">View all</button>
              </div>
              <div id="attendanceWatchList"></div>
            </div>
          </div>
        </section>

        <!-- ================= ROUTINE ================= -->
        <section class="page" id="section-routine">
          <div class="page-toolbar">
            <div class="page-toolbar-info"><h2>Class routine</h2></div>
            <button class="btn btn-primary" id="addRoutineBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add class</span></button>
          </div>
          <div class="routine-grid-wrap">
            <div class="routine-grid" id="routineGrid"></div>
          </div>
          <div class="routine-mobile" id="routineMobile">
            <div class="day-tabs" id="dayTabs"></div>
            <div id="routineDayList"></div>
          </div>
        </section>

        <!-- ================= ASSIGNMENTS ================= -->
        <section class="page" id="section-assignments">
          <div class="page-toolbar">
            <div class="filter-bar">
              <select class="select" id="assignmentStatusFilter">
                <option value="all">All statuses</option>
                <option value="pending">Pending</option>
                <option value="in-progress">In progress</option>
                <option value="completed">Completed</option>
              </select>
              <select class="select" id="assignmentSubjectFilter"><option value="all">All subjects</option></select>
            </div>
            <button class="btn btn-primary" id="addAssignmentBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add assignment</span></button>
          </div>
          <div id="assignmentsContainer"></div>
        </section>

        <!-- ================= EXAMS ================= -->
        <section class="page" id="section-exams">
          <div class="page-toolbar">
            <div class="page-toolbar-info"><h2>Exam schedule</h2></div>
            <button class="btn btn-primary" id="addExamBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add exam</span></button>
          </div>
          <div id="nextExamBanner"></div>
          <div id="examsContainer"></div>
        </section>

        <!-- ================= ATTENDANCE ================= -->
        <section class="page" id="section-attendance">
          <div class="page-toolbar">
            <div class="page-toolbar-info"><h2>Attendance</h2></div>
            <div class="toolbar-btns">
              <button class="btn btn-secondary" id="addAttendanceSubjectBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add subject</span></button>
            </div>
          </div>
          <div class="dash-panel hidden" id="quickMarkPanel" style="margin-bottom: var(--space-5);">
            <div class="dash-panel-header"><h3>Quick mark — today's classes</h3></div>
            <div id="quickMarkList"></div>
          </div>
          <div class="subject-grid" id="attendanceSubjectsGrid"></div>
        </section>

        <!-- ================= CGPA ================= -->
        <section class="page" id="section-cgpa">
          <div class="page-toolbar">
            <div class="page-toolbar-info"><h2>Result / CGPA calculator</h2></div>
            <div class="toolbar-btns">
              <button class="btn btn-secondary" id="gradeScaleBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="18" r="2"/></svg><span>Grade scale</span></button>
              <button class="btn btn-primary" id="addSemesterBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add semester</span></button>
            </div>
          </div>
          <div class="cgpa-summary" id="cgpaSummary"></div>
          <div class="cgpa-chart-wrap hidden" id="cgpaChartWrap">
            <h3>SGPA by semester</h3>
            <div id="cgpaChart"></div>
          </div>
          <div id="semestersContainer"></div>
        </section>

        <!-- ================= MATERIALS ================= -->
        <section class="page" id="section-materials">
          <div class="page-toolbar">
            <div class="filter-bar">
              <input class="input" type="search" id="materialsSearch" placeholder="Search materials…">
              <select class="select" id="materialsSubjectFilter"><option value="all">All subjects</option></select>
            </div>
            <button class="btn btn-primary" id="addMaterialBtn"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>Add material</span></button>
          </div>
          <div class="materials-grid" id="materialsContainer"></div>
        </section>

      </main>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <h2 id="modalTitle">Title</h2>
        <button class="icon-btn" id="modalCloseBtn" aria-label="Close"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>
  <datalist id="subjectsDatalist"></datalist>

<!-- FIREBASE AUTHENTICATION SCRIPT -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
    // Firestore import for future use (Assignments, Routine etc)
    import { getFirestore } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyC1VrcMa2Zo3wlhpEhDa14IrbXlEtjobjQ",
        authDomain: "studentmanagement-84401.firebaseapp.com",
        projectId: "studentmanagement-84401",
        storageBucket: "studentmanagement-84401.firebasestorage.app",
        messagingSenderId: "1023520287147",
        appId: "1:1023520287147:web:a20a35d9f98cac6afa4aee"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Initialize Firestore
    const db = getFirestore(app); 

    // Secure Dashboard Logic
    onAuthStateChanged(auth, (user) => {
        if (!user || !user.emailVerified) {
            window.location.replace("index.html");
        }
    });

    // Logout Logic
    document.getElementById("logout-btn").addEventListener("click", () => {
        signOut(auth).then(() => {
            window.location.replace("index.html");
        }).catch((error) => {
            alert("Logout error: " + error.message);
        });
    });
</script>
</body>
</html>
