<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <script type="module" src="Function/script.js" defer></script>
    <link rel="stylesheet" href="Theme/style.css" />
    <link rel="icon" type="image/x-icon" href="Assets/CourseBookLogo.png" />

    <!-- Stylish Premium Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Course Book</title>
  </head>
  <body>
    <!-- Clean Logo Loader -->
    <div id="appLoader">
      <img
        src="Assets/CourseBookLogo.png"
        alt="Course Book"
        class="loader-logo"
      />
    </div>

    <div class="app-shell">
      <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <img
              src="Assets/CourseBookLogo.png"
              alt="CourseBook Logo"
              class="brand-mark"
            />
            <span class="brand-name">CourseBook</span>
          </div>
          <button
            class="icon-btn sidebar-close"
            id="sidebarCloseBtn"
            aria-label="Close menu"
          >
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="5" y1="5" x2="19" y2="19" />
              <line x1="19" y1="5" x2="5" y2="19" />
            </svg>
          </button>
        </div>
        <nav class="sidebar-nav" id="sidebarNav">
          <button class="nav-item active" data-section="dashboard">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M4 11L12 4l8 7" />
              <path d="M6 10v10h5v-6h2v6h5V10" /></svg
            ><span>Dashboard</span>
          </button>
          <button class="nav-item" data-section="routine">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="5" width="18" height="16" rx="2" />
              <line x1="3" y1="10" x2="21" y2="10" />
              <line x1="8" y1="3" x2="8" y2="7" />
              <line x1="16" y1="3" x2="16" y2="7" /></svg
            ><span>Class routine</span>
          </button>
          <button class="nav-item" data-section="assignments">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="5" y="4" width="14" height="17" rx="2" />
              <rect x="9" y="2" width="6" height="4" rx="1" />
              <line x1="8" y1="11" x2="16" y2="11" />
              <line x1="8" y1="15" x2="16" y2="15" />
              <line x1="8" y1="19" x2="13" y2="19" /></svg
            ><span>Assignments</span>
          </button>
          <button class="nav-item" data-section="exams">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M6 2h9l5 5v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z"
              />
              <polyline points="15 2 15 7 20 7" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="8" y1="17" x2="16" y2="17" /></svg
            ><span>Exam schedule</span>
          </button>
          <button class="nav-item" data-section="attendance">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="9" />
              <polyline points="8 12 11 15 16 9" /></svg
            ><span>Attendance</span>
          </button>
          <button class="nav-item" data-section="cgpa">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="6" y1="20" x2="6" y2="12" />
              <line x1="12" y1="20" x2="12" y2="4" />
              <line x1="18" y1="20" x2="18" y2="14" /></svg
            ><span>CGPA calculator</span>
          </button>
          <button class="nav-item" data-section="materials">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"
              />
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /></svg
            ><span>Course materials</span>
          </button>
        </nav>
        <div class="sidebar-footer">
          <button class="nav-item" id="settingsBtn">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="4" y1="6" x2="20" y2="6" />
              <circle cx="9" cy="6" r="2" />
              <line x1="4" y1="12" x2="20" y2="12" />
              <circle cx="15" cy="12" r="2" />
              <line x1="4" y1="18" x2="20" y2="18" />
              <circle cx="9" cy="18" r="2" /></svg
            ><span>Settings</span>
          </button>
          <button class="nav-item" id="themeToggleBtn">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"
              /></svg
            ><span id="themeToggleLabel">Dark mode</span>
          </button>
        </div>
      </aside>

      <div class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <button
              class="icon-btn menu-btn"
              id="menuBtn"
              aria-label="Open menu"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="3" y1="6" x2="21" y2="6" />
                <line x1="3" y1="12" x2="21" y2="12" />
                <line x1="3" y1="18" x2="21" y2="18" />
              </svg>
            </button>
            <h1 class="page-title" id="pageTitle">Dashboard</h1>
          </div>
          <div class="topbar-actions">
            <button
              class="icon-btn"
              id="themeToggleTop"
              aria-label="Toggle theme"
              style="margin-right: 10px"
            >
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" />
              </svg>
            </button>
            <button class="premium-btn primary-btn" id="profile-btn">
              Profile
            </button>
            <button class="premium-btn danger-btn" id="logout-btn">
              Logout
            </button>
          </div>
        </header>

        <main class="content">
          <!-- ================= DASHBOARD ================= -->
          <section class="page active" id="section-dashboard">
            <div class="dashboard-greeting">
              <h2 id="greetingText">Welcome back</h2>
              <span class="date-line" id="greetingDate"></span>
            </div>

            <div class="stat-strip" id="statStrip"></div>

            <div class="dashboard-grid">
              <div class="dash-panel">
                <div class="dash-panel-header">
                  <h3>Today's classes</h3>
                </div>
                <div id="todayClassesList"></div>
              </div>
              <div class="dash-panel">
                <div class="dash-panel-header">
                  <h3>Upcoming deadlines</h3>
                  <button class="link-btn" data-goto="assignments">
                    View all
                  </button>
                </div>
                <div id="upcomingAssignmentsList"></div>
              </div>
              <div class="dash-panel">
                <div class="dash-panel-header">
                  <h3>Upcoming exams</h3>
                  <button class="link-btn" data-goto="exams">View all</button>
                </div>
                <div id="upcomingExamsList"></div>
              </div>
              <div class="dash-panel">
                <div class="dash-panel-header">
                  <h3>Attendance watch</h3>
                  <button class="link-btn" data-goto="attendance">
                    View all
                  </button>
                </div>
                <div id="attendanceWatchList"></div>
              </div>
            </div>
          </section>

          <!-- ================= ROUTINE ================= -->
          <section class="page" id="section-routine">
            <div class="page-toolbar">
              <div class="page-toolbar-info"><h2>Class routine</h2></div>
              <button class="premium-btn primary-btn" id="addRoutineBtn">
                <svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Add class
              </button>
            </div>
            <div class="routine-grid-wrap scroll-x">
              <div class="routine-grid" id="routineGrid"></div>
            </div>
            <div class="routine-mobile" id="routineMobile">
              <div class="day-tabs scroll-x" id="dayTabs"></div>
              <div id="routineDayList"></div>
            </div>
          </section>

          <!-- ================= ASSIGNMENTS ================= -->
          <section class="page" id="section-assignments">
            <div class="page-toolbar">
              <div class="filter-bar">
                <select class="select" id="assignmentStatusFilter">
                  <option value="all">All statuses</option>
                  <option value="pending">Pending</option>
                  <option value="in-progress">In progress</option>
                  <option value="completed">Completed</option>
                </select>
                <select class="select" id="assignmentSubjectFilter">
                  <option value="all">All subjects</option>
                </select>
              </div>
              <button class="premium-btn primary-btn" id="addAssignmentBtn">
                <svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Add assignment
              </button>
            </div>
            <div id="assignmentsContainer"></div>
          </section>

          <!-- ================= EXAMS ================= -->
          <section class="page" id="section-exams">
            <div class="page-toolbar">
              <div class="page-toolbar-info"><h2>Exam schedule</h2></div>
              <button class="premium-btn primary-btn" id="addExamBtn">
                <svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Add exam
              </button>
            </div>
            <div id="nextExamBanner"></div>
            <div id="examsContainer"></div>
          </section>

          <!-- ================= ATTENDANCE ================= -->
          <section class="page" id="section-attendance">
            <div class="page-toolbar">
              <div class="page-toolbar-info"><h2>Attendance</h2></div>
              <div class="toolbar-btns">
                <button
                  class="premium-btn outline-btn"
                  id="addAttendanceSubjectBtn"
                >
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  Add subject
                </button>
              </div>
            </div>
            <div
              class="dash-panel hidden"
              id="quickMarkPanel"
              style="margin-bottom: var(--space-5)"
            >
              <div class="dash-panel-header">
                <h3>Quick mark — today's classes</h3>
              </div>
              <div id="quickMarkList"></div>
            </div>
            <div class="subject-grid" id="attendanceSubjectsGrid"></div>
          </section>

          <!-- ================= CGPA ================= -->
          <section class="page" id="section-cgpa">
            <div class="page-toolbar">
              <div class="page-toolbar-info">
                <h2>Result / CGPA calculator</h2>
              </div>
              <div
                class="toolbar-btns"
                style="display: flex; gap: 10px; flex-wrap: wrap"
              >
                <button class="premium-btn outline-btn" id="gradeScaleBtn">
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="4" y1="6" x2="20" y2="6" />
                    <circle cx="9" cy="6" r="2" />
                    <line x1="4" y1="12" x2="20" y2="12" />
                    <circle cx="15" cy="12" r="2" />
                    <line x1="4" y1="18" x2="20" y2="18" />
                    <circle cx="9" cy="18" r="2" />
                  </svg>
                  Grade scale
                </button>
                <button class="premium-btn primary-btn" id="addSemesterBtn">
                  <svg
                    class="icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <line x1="12" y1="5" x2="12" y2="19" />
                    <line x1="5" y1="12" x2="19" y2="12" />
                  </svg>
                  Add semester
                </button>
              </div>
            </div>
            <div class="cgpa-summary" id="cgpaSummary"></div>
            <div class="cgpa-chart-wrap hidden scroll-x" id="cgpaChartWrap">
              <h3>SGPA by semester</h3>
              <div id="cgpaChart"></div>
            </div>
            <div id="semestersContainer"></div>
          </section>

          <!-- ================= MATERIALS ================= -->
          <section class="page" id="section-materials">
            <div class="page-toolbar">
              <div class="filter-bar">
                <input
                  class="input"
                  type="search"
                  id="materialsSearch"
                  placeholder="Search materials…"
                />
                <select class="select" id="materialsSubjectFilter">
                  <option value="all">All subjects</option>
                </select>
              </div>
              <button class="premium-btn primary-btn" id="addMaterialBtn">
                <svg
                  class="icon"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <line x1="12" y1="5" x2="12" y2="19" />
                  <line x1="5" y1="12" x2="19" y2="12" />
                </svg>
                Add material
              </button>
            </div>
            <div class="materials-grid" id="materialsContainer"></div>
          </section>
        </main>
      </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
      <div
        class="modal"
        id="modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="modalTitle"
      >
        <div class="modal-header">
          <h2 id="modalTitle">Title</h2>
          <button class="modal-close-btn" id="modalCloseBtn" aria-label="Close">
            <svg
              class="icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="5" y1="5" x2="19" y2="19" />
              <line x1="19" y1="5" x2="5" y2="19" />
            </svg>
          </button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <datalist id="subjectsDatalist"></datalist>
  </body>
</html>
